name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync dependencies
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        env:
          ADMIN_PASSWORD: Admin123
          LEARNER_PASSWORD: Learner123
          JWT_SECRET_KEY: ci-test-secret
        run: uv run pytest -q

      - name: Check database migrations
        env:
          ADMIN_PASSWORD: Admin123
          LEARNER_PASSWORD: Learner123
          JWT_SECRET_KEY: ci-test-secret
        run: |
          uv run python -m alembic upgrade head
          uv run python -m alembic check

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mars-recommender:${{ github.sha }} .

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker-build

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Validate deploy secrets
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_APP_DIR"
          test -n "$VPS_SSH_KEY"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "set -eu;
             cd '$VPS_APP_DIR';
             git fetch --prune origin;
             git checkout main;
             git reset --hard '$GITHUB_SHA';
             docker compose up --build -d --remove-orphans;
             docker compose ps"